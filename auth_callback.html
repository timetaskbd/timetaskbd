<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating... — Time Task BD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spinner {
      border: 4px solid rgba(19, 236, 91, 0.15);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border-left-color: #13ec5b;
      animation: spin 1s cubic-bezier(0.55, 0.25, 0.25, 0.9) infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#f6f8f6] min-h-screen flex flex-col items-center justify-center text-[#0d1b12] font-sans antialiased">
  <div class="text-center p-8 bg-white rounded-3xl shadow-xl border border-slate-100 max-w-sm w-full mx-4">
    <div class="spinner mx-auto mb-6"></div>
    <h2 class="text-2xl font-black mb-2 text-[#0d1b12]">Authenticating</h2>
    <p class="text-gray-500 text-sm">Synchronizing your credentials and permissions…</p>
  </div>

  <script type="module">
    import { handleAuthCallback } from '../auth_backend_logic.js';

    document.addEventListener('DOMContentLoaded', async () => {
      await handleAuthCallback();
    });
  </script>
</body>
</html>
