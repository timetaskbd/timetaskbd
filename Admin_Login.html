<!doctype html>
<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Time Task BD - Admin Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#13ec5b",
            "background-light": "#f6f8f6",
            "sidebar-deep": "#102216",
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
          },
        },
      },
    };
  </script>
</head>

<body class="bg-sidebar-deep text-white min-h-screen flex items-center justify-center p-4">
  <div
    class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
    <!-- Decorative Glow -->
    <div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>

    <div class="relative z-10 text-center mb-10">
      <div class="inline-flex items-center justify-center size-16 bg-primary/20 rounded-2xl mb-4 text-primary">
        <span class="material-symbols-outlined text-4xl">admin_panel_settings</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Admin Portal</h1>
      <p class="text-white/50 text-sm">Restricted Access • Authorized Personnel Only</p>
    </div>

    <form id="adminLoginForm" class="space-y-6 relative z-10">
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-white/50 pl-1">Admin Identity</label>
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-white/30 group-focus-within:text-primary transition-colors">mail</span>
          <input type="email" id="email" required
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-white/20 focus:bg-white/10 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
            placeholder="admin@timetaskbd.com">
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-bold uppercase tracking-widest text-white/50 pl-1">Secure Passkey</label>
        <div class="relative group">
          <span
            class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-white/30 group-focus-within:text-primary transition-colors">lock</span>
          <input type="password" id="password" required
            class="w-full bg-white/5 border border-white/10 rounded-xl py-3.5 pl-12 pr-4 text-white placeholder-white/20 focus:bg-white/10 focus:border-primary focus:ring-1 focus:ring-primary transition-all outline-none"
            placeholder="••••••••••••">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full bg-primary text-sidebar-deep font-bold py-4 rounded-xl hover:bg-white hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
        <span class="material-symbols-outlined">login</span>
        Authenticate Access
      </button>

      <div class="my-6 flex items-center justify-between">
        <span class="w-1/5 border-b border-white/10 lg:w-1/4"></span>
        <span class="text-xs text-center text-white/50 uppercase tracking-widest">or</span>
        <span class="w-1/5 border-b border-white/10 lg:w-1/4"></span>
      </div>

      <button type="button" id="googleLoginBtn"
        class="w-full bg-white/10 hover:bg-white/20 text-white font-bold py-3.5 rounded-xl transition-all border border-white/10 flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-[0.98]">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4" />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853" />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05" />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335" />
        </svg>
        Sign in with Google
      </button>
    </form>

    <div class="mt-8 text-center relative z-10">
      <a href="../Web Dashboard/Home_Page.html"
        class="text-xs font-bold text-white/30 hover:text-white transition-colors flex items-center justify-center gap-1">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        Return to Platform
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-client.js"></script>
  <script>
    const loginForm = document.getElementById('adminLoginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const googleBtn = document.getElementById('googleLoginBtn');

    // Prefer shared client from supabase-client.js; fallback to env globals.
    const _supabase = window.supabaseClient || (
      (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined')
        ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null
    );
    const normalizeRole = (v) => String(v || '').trim().toLowerCase();
    const isValidEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    function showAuthError(message) {
      alert(message || "Authentication failed. Please try again.");
    }

    // --- Google Login Handler ---
    googleBtn.addEventListener('click', async () => {
      if (!_supabase) {
        showAuthError("Login service is not ready. Please refresh the page.");
        return;
      }
      try {
        const { data, error } = await _supabase.auth.signInWithOAuth({
          provider: 'google',
          options: {
            // Redirect back to this page to verify admin role
            redirectTo: window.location.origin + '/Admin%20Dashboard/Admin_Login.html',
            queryParams: {
              access_type: 'offline',
              prompt: 'consent'
            }
          }
        });
        if (error) throw error;
      } catch (err) {
        console.error("Google login error:", err);
        showAuthError("Google login failed. Please try again.");
      }
    });

    // --- Check Session on Load (Handle Redirect) ---
    window.addEventListener('load', async () => {
      if (!_supabase) {
        window.location.href = "/Admin%20Dashboard/Admin_Login.html";
        return;
      }
      const { data: { session } } = await _supabase.auth.getSession();
      if (session) {
        // Verify Role
        const { data: profile, error } = await _supabase
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .single();

        // normalizeRole() lowercases — compare against lowercase 'admin'
        if (normalizeRole(profile?.role) === 'Admin') {
          window.location.href = "Admin%20Index.html";
        } else if (profile) {
          // Logged in but not admin
          showAuthError("Access denied: administrator privileges required.");
          await _supabase.auth.signOut();
        }
      }
    });

    // --- Email/Password Login Handler ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAuthError("Please enter both email and password.");
        return;
      }
      if (!isValidEmail(email) || email.length > 254 || password.length < 8) {
        showAuthError("Invalid email or password format.");
        return;
      }
      if (!_supabase) {
        showAuthError("Login service is not ready. Please refresh the page.");
        return;
      }

      const originalBtnText = submitBtn.innerHTML;
      submitBtn.innerHTML = `<span class="animate-spin material-symbols-outlined">progress_activity</span> Verifying...`;
      submitBtn.disabled = true;

      try {
        // 1. Sign In
        const { data: { session }, error } = await _supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;
        if (!session) throw new Error("No session created.");

        // 2. Check Admin Role
        const { data: profile, error: profileError } = await _supabase
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .single();

        if (profileError) {
          console.warn("Profile fetch error", profileError);
          throw new Error("Access denied: unable to verify administrator account.");
        }

        // normalizeRole() lowercases — compare against lowercase 'admin'
        if (normalizeRole(profile?.role) !== 'Admin') {
          await _supabase.auth.signOut();
          throw new Error("Access denied: administrator role required.");
        }

        // 3. Success
        window.location.href = "Admin%20Index.html";

      } catch (err) {
        console.error("Admin login failed:", err);
        showAuthError(err?.message || "Login failed. Please check your credentials.");
        submitBtn.innerHTML = originalBtnText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
